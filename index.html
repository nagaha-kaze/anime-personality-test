<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#0f0f1a;color:#fff;line-height:1.6;min-height:100vh;position:relative}

.page{position:relative;z-index:1;max-width:768px;margin:0 auto;min-height:100vh;padding:40px 24px;display:none;flex-direction:column;animation:pageIn .5s ease}
.page.active{display:flex}
@keyframes pageIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.welcome{align-items:center;justify-content:center;text-align:center}
.welcome .hero-icon{font-size:80px;margin-bottom:24px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.welcome h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#a78bfa 0%,#60a5fa 50%,#f472b6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px;line-height:1.3}
.welcome .subtitle{font-size:16px;color:rgba(255,255,255,.7);margin-bottom:8px}
.welcome .guide{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:48px}
.btn-primary{background:linear-gradient(135deg,#8b5cf6 0%,#3b82f6 100%);color:#fff;border:none;border-radius:50px;padding:18px 60px;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 0 30px rgba(139,92,246,.5),0 0 60px rgba(59,130,246,.3);transition:transform .2s,box-shadow .2s}
.btn-primary:active{transform:scale(.96);box-shadow:0 0 20px rgba(139,92,246,.6)}
.btn-secondary{background:transparent;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:14px 36px;font-size:15px;cursor:pointer;transition:all .2s}
.btn-secondary:active{background:rgba(255,255,255,.1);transform:scale(.96)}
.welcome .foot-note{position:absolute;bottom:32px;font-size:12px;color:rgba(255,255,255,.35)}
.quiz-top{margin-bottom:32px}
.progress-bar-bg{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#f472b6);border-radius:3px;transition:width .4s ease;box-shadow:0 0 10px rgba(139,92,246,.6)}
.progress-text{font-size:13px;color:rgba(255,255,255,.6);text-align:right}
.question-content{flex:1;display:flex;flex-direction:column}
.question-text{font-size:22px;font-weight:600;text-align:center;margin-bottom:40px;line-height:1.5;min-height:60px}
.options-list{display:flex;flex-direction:column;gap:14px;flex:1}
.option-btn{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:16px;padding:18px 20px;color:#fff;font-size:15px;text-align:left;cursor:pointer;transition:all .25s ease}
.option-btn:active,.option-btn.selected{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(59,130,246,.2));border-color:#8b5cf6;box-shadow:0 0 20px rgba(139,92,246,.3);transform:scale(.98)}
.quiz-bottom{margin-top:24px;text-align:center}
.btn-back{background:none;border:none;color:rgba(255,255,255,.4);font-size:14px;cursor:pointer;padding:10px 20px}
.btn-back:disabled{opacity:.2;cursor:not-allowed}
.loading{align-items:center;justify-content:center;text-align:center}
.loading-ring{width:120px;height:120px;position:relative;margin-bottom:40px}
.loading-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#8b5cf6;border-right-color:#3b82f6;animation:spin 1.2s linear infinite}
.loading-ring::after{content:'';position:absolute;inset:16px;border-radius:50%;border:2px solid transparent;border-bottom-color:#f472b6;border-left-color:#a78bfa;animation:spin .8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:18px;color:rgba(255,255,255,.8);min-height:30px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.result-header{text-align:center;margin-bottom:32px}
.reveal-label{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:8px}
.result-char-name{font-size:36px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#60a5fa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.result-char-ip{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:16px}
.compatibility-badge{display:inline-block;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(59,130,246,.2));border:1px solid rgba(139,92,246,.4);border-radius:50px;padding:8px 24px;font-size:14px}
.compatibility-badge span{color:#a78bfa;font-weight:700;font-size:18px}
.result-title{text-align:center;font-size:16px;font-weight:600;color:#c4b5fd;margin:24px 0 20px;padding:0 16px;position:relative}
.result-title::before,.result-title::after{content:'';position:absolute;top:50%;width:40px;height:1px;background:linear-gradient(90deg,transparent,rgba(196,181,253,.6),transparent)}
.result-title::before{left:0}.result-title::after{right:0}
.result-tags{display:flex;justify-content:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.result-tag{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:6px 16px;font-size:13px;color:rgba(255,255,255,.8)}
.radar-section{background:rgba(255,255,255,.03);border-radius:20px;padding:20px;margin-bottom:24px}
.radar-title{text-align:center;font-size:14px;color:rgba(255,255,255,.5);margin-bottom:12px}
#radarChart{width:100%;height:320px}
.desc-section{background:rgba(255,255,255,.03);border-radius:20px;padding:24px;margin-bottom:24px}
.desc-section h3{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:16px;text-align:center}
.desc-paragraph{font-size:14px;color:rgba(255,255,255,.85);line-height:1.8;margin-bottom:12px}
.desc-paragraph:last-child{margin-bottom:0}
.quote-section{background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(244,114,182,.1));border-left:3px solid #a78bfa;border-radius:12px;padding:20px 24px;margin-bottom:24px;text-align:center}
.quote-text{font-size:16px;color:rgba(255,255,255,.9);font-style:italic;line-height:1.6}
.guide-section{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(96,165,250,.1));border:1px solid rgba(96,165,250,.3);border-radius:16px;padding:20px;margin-bottom:32px}
.guide-title{font-size:14px;color:#60a5fa;font-weight:600;margin-bottom:10px}
.guide-text{font-size:14px;color:rgba(255,255,255,.85);line-height:1.7}
.result-buttons{display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.result-buttons .btn-primary{width:100%;padding:16px;font-size:16px}
.result-buttons .btn-secondary{width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.modal-overlay.active{display:flex}
.modal-poster{max-width:100%;max-height:80vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-hint{color:rgba(255,255,255,.7);font-size:14px;margin-top:20px;margin-bottom:16px}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;padding:10px 30px;border-radius:30px;font-size:14px;cursor:pointer}
.poster-template{width:750px;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f0f1a 100%);padding:60px 50px;color:#fff;position:relative;overflow:hidden}
.poster-template::before{content:'';position:absolute;top:-100px;left:-100px;width:300px;height:300px;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 70%)}
.poster-template::after{content:'';position:absolute;bottom:-100px;right:-100px;width:300px;height:300px;background:radial-gradient(circle,rgba(244,114,182,.3),transparent 70%)}
.poster-title{font-size:36px;font-weight:800;text-align:center;background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:40px}
.poster-char{text-align:center;margin-bottom:30px}
.poster-char-name{font-size:72px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#60a5fa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.poster-char-ip{font-size:22px;color:rgba(255,255,255,.6)}
.poster-compat{text-align:center;margin-bottom:30px}
.poster-compat-num{font-size:80px;font-weight:900;color:#f472b6;text-shadow:0 0 30px rgba(244,114,182,.5)}
.poster-compat-label{font-size:20px;color:rgba(255,255,255,.6)}
.poster-tags{display:flex;justify-content:center;gap:20px;margin-bottom:50px}
.poster-tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:30px;padding:10px 24px;font-size:18px;color:rgba(255,255,255,.9)}
.poster-title-text{text-align:center;font-size:24px;font-weight:700;color:#c4b5fd;margin-bottom:40px;padding:0 30px;line-height:1.5}
.poster-bottom{display:flex;align-items:center;justify-content:center;gap:30px;padding-top:40px;border-top:1px solid rgba(255,255,255,.1)}
.poster-qrcode{width:120px;height:120px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.poster-qrcode-placeholder{width:100px;height:100px;background:repeating-linear-gradient(45deg,#333,#333 4px,#fff 4px,#fff 8px);opacity:.7;border-radius:4px}
.poster-qrcode-text .big{font-size:22px;font-weight:600;color:#fff;margin-bottom:6px}
.poster-qrcode-text .small{font-size:14px;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="page welcome active" id="page-welcome">
  <div class="hero-icon">✨</div>
  <h1>你的二次元人格是谁？</h1>
  <div class="subtitle">18道题 · 解锁你的动漫灵魂</div>
  <div class="guide">跟随直觉选择，遇见最像你的那个角色</div>
  <button class="btn-primary" onclick="startQuiz()">开始测试</button>
  <div class="foot-note">答案没有对错，真实选择才最准</div>
</div>
<div class="page quiz" id="page-quiz">
  <div class="quiz-top">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-text"><span id="currentNum">1</span> / 18</div>
  </div>
  <div class="question-content">
    <div class="question-text" id="questionText"></div>
    <div class="options-list" id="optionsList"></div>
  </div>
  <div class="quiz-bottom">
    <button class="btn-back" id="btnBack" onclick="prevQuestion()" disabled>上一题</button>
  </div>
</div>
<div class="page loading" id="page-loading">
  <div class="loading-ring"></div>
  <div class="loading-text" id="loadingText">正在扫描你的灵魂代码...</div>
</div>
<div class="page result" id="page-result">
  <div class="result-header">
    <div class="reveal-label">你的二次元人格是</div>
    <div class="result-char-name" id="resultName"></div>
    <div class="result-char-ip" id="resultIp"></div>
    <div class="compatibility-badge">灵魂契合度 <span id="resultCompat">0</span>%</div>
  </div>
  <div class="result-title" id="resultTitle"></div>
  <div class="result-tags" id="resultTags"></div>
  <div class="radar-section"><div class="radar-title">五维人格雷达图</div><div id="radarChart"></div></div>
  <div class="desc-section">
    <h3>人格解析</h3>
    <div id="resultDesc"></div>
  </div>
  <div class="quote-section"><div class="quote-text" id="resultQuote"></div></div>
  <div class="guide-section">
    <div class="guide-title">💫 二次元生存指南</div>
    <div class="guide-text" id="resultGuide"></div>
  </div>
  <div class="result-buttons">
    <button class="btn-primary" onclick="generatePoster()">生成分享海报</button>
    <button class="btn-secondary" onclick="restart()">再测一次</button>
  </div>
</div>
<div class="modal-overlay" id="posterModal">
  <img class="modal-poster" id="posterImg" alt="分享海报">
  <div class="modal-hint">长按图片保存分享</div>
  <button class="modal-close" onclick="closePoster()">关闭</button>
</div>
<div style="position:absolute;left:-9999px;top:0;">
  <div class="poster-template" id="posterTemplate">
    <div class="poster-title">✨ 我的二次元人格居然是TA！</div>
    <div class="poster-char">
      <div class="poster-char-name" id="posterName"></div>
      <div class="poster-char-ip" id="posterIp"></div>
    </div>
    <div class="poster-compat">
      <div class="poster-compat-num" id="posterCompat">0%</div>
      <div class="poster-compat-label">灵魂契合度</div>
    </div>
    <div class="poster-title-text" id="posterTitle"></div>
    <div class="poster-tags" id="posterTags"></div>
    <div class="poster-bottom">
      <div class="poster-qrcode"><div class="poster-qrcode-placeholder"></div></div>
      <div>
        <div class="poster-qrcode-text big">测测你的二次元灵魂</div>
        <div class="poster-qrcode-text small">长按识别 · 一起玩</div>
      </div>
    </div>
  </div>
</div>
<script>
const QUESTIONS=[
{q:"漫展面基结束回到家，你的第一感受是？",opts:[{t:"超开心！还在回味聊天，马上发返图",s:[2,0,0,0,0]},{t:"挺愉快的，瘫一会儿再整理照片",s:[1,0,0,0,0]},{t:"有点累，只想安静刷会儿手机",s:[-1,0,0,0,0]},{t:"好累…社交能量耗尽，需要独处一整天回血",s:[-2,0,0,0,0]}]},
{q:"看一部虐心番时，主角做出牺牲自己的选择，你的第一反应是？",opts:[{t:"完全共情，跟着主角一起掉眼泪",s:[0,2,0,0,0]},{t:"有点难过，但更在意剧情逻辑合不合理",s:[0,1,0,0,0]},{t:"理性分析这个选择的利弊，觉得有更好的办法",s:[0,-1,0,0,0]},{t:"剧情需要而已，不会投入太多情绪",s:[0,-2,0,0,0]}]},
{q:"去漫展之前，你会做什么准备？",opts:[{t:"提前一周做攻略：路线、摊位、清单、时间表",s:[0,0,2,0,0]},{t:"提前一天列个大概的必逛摊位",s:[0,0,1,0,0]},{t:"想到什么逛什么，随缘溜达",s:[0,0,-1,0,0]},{t:"完全不做准备，到了再说，迷路也没关系",s:[0,0,-2,0,0]}]},
{q:"看新番第一集的时候，你更关注？",opts:[{t:"画面细节、作画质量、声优表现",s:[0,0,0,0,2]},{t:"剧情节奏、人物设定",s:[0,0,0,0,1]},{t:"伏笔和隐喻，猜测后续发展",s:[0,0,0,0,-1]},{t:"疯狂开脑洞，脑补各种衍生剧情",s:[0,0,0,0,-2]}]},
{q:"打竞技类游戏的时候，你的心态是？",opts:[{t:"必须赢！输了会很不服气，再来一把直到赢",s:[0,0,0,2,0]},{t:"想赢，但输了也不会太在意",s:[0,0,0,1,0]},{t:"快乐最重要，输赢无所谓",s:[0,0,0,-1,0]},{t:"佛系娱乐，甚至故意搞怪整活",s:[0,0,0,-2,0]}]},
{q:"新建的同好群里大家在热烈讨论新番，你会？",opts:[{t:"立刻加入吐槽，疯狂发表自己的观点",s:[2,0,0,0,0]},{t:"看到感兴趣的点会插几句话",s:[1,0,0,0,0]},{t:"默默潜水看大家聊，很少发言",s:[-1,0,0,0,0]},{t:"悄悄退群，人太多的群看着就慌",s:[-2,0,0,0,0]}]},
{q:"朋友因为磕的CP BE了很难过，来找你倾诉，你会？",opts:[{t:"一起骂作者，共情安慰她的情绪",s:[0,2,0,0,0]},{t:"听她吐槽，陪她一起难过",s:[0,1,0,0,0]},{t:"帮她分析剧情走向，说其实还有伏笔",s:[0,-1,0,0,0]},{t:"劝她别太上头，虚拟角色而已",s:[0,-2,0,0,0]}]},
{q:"你的追番习惯是？",opts:[{t:"定好闹钟，更新当天立刻看完",s:[0,0,2,0,0]},{t:"攒个两三集一起看，有固定追番时间",s:[0,0,1,0,0]},{t:"想起来就看，没固定时间",s:[0,0,-1,0,0]},{t:"随缘补番，一部番能看半年",s:[0,0,-2,0,0]}]},
{q:"当你听到一首熟悉的动漫OST，你第一反应是？",opts:[{t:"想起对应的名场面画面",s:[0,0,0,0,2]},{t:"回忆起看番时的心情",s:[0,0,0,0,1]},{t:"开始脑补自己的同人剧情",s:[0,0,0,0,-1]},{t:"陷入抽象的情绪和联想里",s:[0,0,0,0,-2]}]},
{q:"同好之间讨论有争议的剧情话题，你会？",opts:[{t:"坚持自己的观点，一定要辩个明白",s:[0,0,0,2,0]},{t:"会表达自己的看法，但不会争到底",s:[0,0,0,1,0]},{t:"听听大家的想法，不发表对立意见",s:[0,0,0,-1,0]},{t:"跳过争议话题，聊点开心的不好吗",s:[0,0,0,-2,0]}]},
{q:"周末有两个可选活动，你更倾向于？",opts:[{t:"约上三五好友去线下同人市集逛一整天",s:[2,0,0,0,0]},{t:"和1-2个好友在家连麦打游戏",s:[1,0,0,0,0]},{t:"自己窝在家里补番吃零食",s:[-1,0,0,0,0]},{t:"关掉社交软件，一个人发呆都觉得很舒服",s:[-2,0,0,0,0]}]},
{q:"你在游戏里组队打副本，队友失误导致团灭，你会？",opts:[{t:"没关系没关系，再来一次就好",s:[0,2,0,0,0]},{t:"稍微有点不爽，但不会说出来",s:[0,1,0,0,0]},{t:"指出刚才的失误点，下次注意就行",s:[0,-1,0,0,0]},{t:"有点生气，为什么不提前看攻略",s:[0,-2,0,0,0]}]},
{q:"接下来一周有空闲时间，你会？",opts:[{t:"提前安排好每天要做的事，按计划执行",s:[0,0,2,0,0]},{t:"列个待办清单，顺序可以调整",s:[0,0,1,0,0]},{t:"到那天再说，看心情做什么",s:[0,0,-1,0,0]},{t:"完全不规划，躺平到天荒地老",s:[0,0,-2,0,0]}]},

{name:"五条悟",ip:"《咒术回战》",code:"ETPAN",title:"天上天下唯我独尊的混沌最强者",tags:["最强天花板","吊儿郎当","混沌善意"],desc:"你是天生的焦点人物，走到哪里都自带强大气场，却总爱用吊儿郎当的外表藏住深不可测的实力与心思。你做事从不按常理出牌，讨厌刻板的规则与束缚，习惯用自己的方式守护在意的人。\n看似随性散漫，实则逻辑极其清醒，能一眼看透事物本质，只是懒得按部就班。你有宏大的视野与想法，不会拘泥于眼前的小事，骨子里带着不服输的傲气，却从不对弱者出手。\n在人际关系里，你是朋友中的开心果与兜底者，平时爱开玩笑搞怪，关键时刻永远是最靠谱的那个。你不轻易袒露内心，能走进你世界的人很少，但一旦被你认可，就会被你毫无保留地护在身后。",quote:"天上天下，唯我独尊。",guide:"适当收敛锋芒，偶尔给别人一点表现机会，不然身边的人压力会很大哦。"},
{name:"两面宿傩",ip:"《咒术回战》",code:"ETJAN",title:"俯视众生的诅咒之王",tags:["绝对实力","支配者","杀伐果断"],desc:"你是天生的强者，骨子里带着刻入骨髓的傲慢与自信，从不屑于伪装与讨好。你做事极具目标感与掌控力，一旦认定方向就会步步为营，任何人都无法阻挡你的脚步。\n你理性到近乎冷酷，习惯用结果衡量一切，讨厌软弱与无意义的同情。你有极强的大局观与深远的谋略，不会被眼前情绪左右，永远清楚自己想要什么，该牺牲什么。\n在人际关系里，你处于绝对的支配地位，很少有人能跟上你的节奏。你不屑于泛泛之交，只认可真正有实力的人。对你来说，温柔是极其奢侈的东西，只有极少数人能让你放下戒备。",quote:"你太弱了，让我觉得可笑。",guide:"偶尔试着站在别人的角度看问题，你会发现很多事没必要那么极端。"},
{name:"乙骨忧太",ip:"《咒术回战》",code:"IFJCN",title:"背负爱的温柔天才",tags:["温柔强大","深情专一","隐忍克制"],desc:"你是内心柔软的温柔者，总是习惯性地照顾别人的感受，把在意的人放在比自己更重要的位置。你性格偏内向，不擅长表达情绪，却会用行动默默付出，背负所有压力也不愿让身边人担心。\n你做事认真克制，有极强的责任感与原则性，一旦认定的事就会坚持到底。你骨子里带着一股韧劲，平时看起来温和好说话，触及底线时会爆发出惊人的力量。\n在感情里，你是极致的专一与深情，爱一个人就会刻进骨子里，哪怕跨越生死也不会改变。你很容易陷入自我内耗，习惯把所有过错揽在自己身上，其实你已经做得很好了。",quote:"我对她的爱，比世界上任何人都深。",guide:"别总是自己扛下一切，试着向身边的人求助，你值得被温柔以待。"},
{name:"虎杖悠仁",ip:"《咒术回战》",code:"EFPAS",title:"向阳而生的热血笨蛋",tags:["天然热血","共情力MAX","乐观派"],desc:"你是天生的小太阳，性格开朗直率，走到哪里都能带来活力与欢笑。你共情力极强，见不得别人受苦，哪怕是陌生人也会毫不犹豫地伸出援手，把别人的事当成自己的事。\n你做事随性洒脱，不喜欢纠结复杂的道理，认准了就立刻行动。你活在当下，珍惜每一个眼前的人，哪怕身处绝境也能保持乐观，永远朝着光亮的方向走。\n在人际关系里，你是所有人的开心果与粘合剂，真诚坦率，没有一点心机，大家都喜欢和你相处。你重视伙伴胜过自己，为了守护重要的人，可以爆发出超越极限的力量。",quote:"我会让所有人都幸福地死去。",guide:"偶尔也多为自己考虑一下，你的感受同样很重要。"},
{name:"灶门炭治郎",ip:"《鬼灭之刃》",code:"IFJCS",title:"温柔坚韧的治愈之魂",tags:["共情天花板","温柔坚定","靠谱担当"],desc:"你是骨子里带着温柔的人，对世界抱有最大的善意，哪怕身处深渊也从不会丢掉内心的柔软。你做事认真踏实，有自己的原则与底线，温和却绝不软弱。\n你共情力极强，能敏锐感知别人的情绪，见不得任何人受委屈。你习惯用行动表达心意，默默承担很多事情，不抱怨不张扬，却总能把一切都打理好。\n在人际关系里，你是大家的依靠与定心丸，只要有你在就会觉得很安心。你珍惜每一份感情，会牢牢记住别人的好，并用加倍的温柔回报，是值得交付后背的人。",quote:"心之力量，才是人类最强的力量。",guide:"善良也要带点锋芒，别让你的温柔变成别人伤害你的武器。"},
{name:"蝴蝶忍",ip:"《鬼灭之刃》",code:"ITJAN",title:"笑里藏刀的剧毒谋略家",tags:["白切黑","心思缜密","隐忍腹黑"],desc:"你总是带着温柔的笑意，内心却藏着极深的心思与执念。你做事极其有规划，步步为营，每一步都在你的计算之中，很少有人能看透你的真实想法。\n你理性冷静，情绪从不外露，哪怕内心翻江倒海，表面也能云淡风轻。你有极强的目标感，为了达成目的可以隐忍一切，擅长用温柔的外表包裹锋利的内核。\n在人际关系里，你是让人捉摸不透的存在，友善却有距离感。你不会轻易信任别人，但一旦认可对方，就会成为最可靠的盟友。",quote:"我最讨厌的词，就是'努力就会有回报'。",guide:"偶尔卸下防备，不用时刻都保持完美的微笑，真实的你也很可爱。"},
{name:"我妻善逸",ip:"《鬼灭之刃》",code:"IFPCS",title:"胆小却可靠的极致反差者",tags:["社恐胆小","感性细腻","关键时刻靠谱"],desc:"你平时看起来胆小怕事，容易焦虑紧张，遇到困难第一反应是想逃避。但你内心极其细腻敏感，能察觉到很多别人忽略的细节，重感情、懂感恩。\n你做事随性散漫，不喜欢给自己太大压力，日常摆烂是常态。但只要触及你在意的人或事，就会瞬间切换状态，爆发出远超平时的力量，靠谱到让人惊讶。\n在人际关系里，你是需要被照顾的那一个，但也会用自己的方式守护重要的人。你虽然嘴上空话多，但真到了紧要关头，永远不会丢下朋友独自逃跑。",quote:"就算再害怕，就算再胆小，我也会战斗！",guide:"不用逼自己变得外向，胆小的你也有独一无二的闪光点。"},
{name:"富冈义勇",ip:"《鬼灭之刃》",code:"ITJCS",title:"沉默寡言的水柱实力派",tags:["高冷社恐","极致自律","温柔笨拙"],desc:"你话很少，不擅长表达情绪，总是一副冷冰冰的样子，很容易被人误解成高傲。但你内心其实极其温柔笨拙，只是不知道该怎么和人打交道，习惯用行动代替语言。\n你做事极度认真自律，对自己要求严苛，恪守规则与底线，是典型的实干派。你不喜欢争名夺利，默默做好自己的事，实力强大却从不张扬。\n在人际关系里，你不擅长社交，朋友不多，但每一个都是过命的交情。你不会说暖心的话，却会在别人需要的时候默默出现，用行动守护在意的人。",quote:"我没有被讨厌。",guide:"试着多说几句话，不然别人真的会以为你讨厌他们。"},
{name:"芙丽莲",ip:"《葬送的芙丽莲》",code:"ITPCN",title:"漫步时光的魔法观察者",tags:["慢热淡然","理性通透","深度思考者"],desc:"你是个慢热又淡然的人，习惯站在旁观者的角度看世界，情绪很少有大的起伏。你做事随性散漫，不喜欢被计划束缚，按照自己的节奏慢慢往前走。\n你理性又通透，看过太多人和事，对很多东西都看得很开。你喜欢思考抽象的问题，探索事物背后的本质，比起眼前的喧嚣，更在意精神世界的富足。\n在人际关系里，你很慢热，不会很快和人熟络，但感情会随着时间越来越深。你不擅长表达感情，却会把重要的人默默记在心里，用漫长的时光去怀念。",quote:"人类的生命真是短暂啊。",guide:"偶尔也加快脚步看看身边的风景，别等错过了才想起珍惜。"},
{name:"辛美尔",ip:"《葬送的芙丽莲》",code:"IFJCS",title:"温柔坚定的勇者之光",tags:["理想勇者","温柔担当","坚定信仰"],desc:"你是典型的理想主义者，内心有坚定的信念与原则，温柔却有力量。你做事认真负责，有担当有底线，答应别人的事就一定会做到。\n你感性又共情，见不得弱小受欺负，愿意为了正义与守护挺身而出。你活在当下，珍惜每一段相遇，认真对待每一个人，用自己的方式温暖着身边的人。\n在人际关系里，你是值得信赖的伙伴与领导者，总能给人安全感。你会照顾到每个人的情绪，包容别人的缺点，是像光一样的存在。",quote:"勇者就是要为了保护大家而战啊。",guide:"不用一直坚强，偶尔也可以脆弱一下，你已经做得很好了。"},
{name:"菲伦",ip:"《葬送的芙丽莲》",code:"ITJCS",title:"认真靠谱的优等生魔法使",tags:["严谨自律","懂事靠谱","踏实努力"],desc:"你是个认真又懂事的人，做事严谨有条理，从来不让人担心。你对自己要求很高，习惯把事情做到最好，踏实努力，一步一个脚印往前走。\n你理性温和，情绪稳定，遇到事情总能冷静处理，很少冲动行事。你务实不空想，专注于眼前的事，把每一件小事都做好，慢慢靠近自己的目标。\n在人际关系里，你是贴心又靠谱的朋友，会默默照顾别人的感受，做事分寸感很好。你不喜欢出风头，却总能在关键时刻帮上大忙。",quote:"魔法是需要努力才能掌握的。",guide:"偶尔也偷个懒，不用事事都追求完美，松弛一点也没关系。"},
{name:"休塔尔克",ip:"《葬送的芙丽莲》",code:"EFPAS",title:"热血直球的战士行动派",tags:["热血直率","敢想敢干","重情重义"],desc:"你是个直来直去的行动派，想到什么就做什么，从不扭捏犹豫。你性格开朗热血，浑身充满活力，和你在一起永远不会觉得无聊。\n你做事随性勇敢，不喜欢想太多复杂的后果，认准了就往前冲。你重情重义，为了朋友可以两肋插刀，永远把伙伴放在第一位。\n在人际关系里，你是气氛担当，直爽真诚，没有一点心机，大家都喜欢和你相处。你虽然有时候有点冲动，但那份纯粹的真心最打动人。",quote:"战士就是要冲在最前面！",guide:"行动之前多思考两秒，能少走很多弯路哦。"},
{name:"高松灯",ip:"《MyGO!!!!!》",code:"IFPAN",title:"执拗纯粹的音乐追光者",tags:["敏感细腻","极致执着","内心丰富"],desc:"你是个内心极其丰富敏感的人，对热爱的事物有着近乎偏执的执着。你性格偏内向，不擅长表达自己，却会在喜欢的事情上爆发出惊人的能量。\n你做事随性，跟着感觉走，不喜欢被规则束缚。你容易陷入情绪里，脑洞很大，脑子里总有很多奇思妙想，对世界有自己独特的理解。\n在人际关系里，你慢热又笨拙，不会主动社交，但对认可的人极其真心。你对感情很纯粹，一旦认定就会全身心投入，哪怕受伤也不后悔。",quote:"我啊，只要有音乐就够了。",guide:"别太在意别人的眼光，你的热爱本身就是最耀眼的光。"},
{name:"千早爱音",ip:"《MyGO!!!!!》",code:"EFPAS",title:"敢想敢冲的直球元气少女",tags:["外向直球","元气满满","不服输"],desc:"你是个阳光开朗的行动派，想到什么就说什么，直来直去不绕弯子。你浑身充满活力，永远都在往前冲，遇到困难也不会轻易认输。\n你做事随性自在，不喜欢纠结，想做就立刻去做。你好胜心强，不服输，越是有挑战的事情越想做好，浑身有一股不服输的韧劲。\n在人际关系里，你是气氛活跃者，走到哪里都能带来欢笑。你真诚坦率，虽然有时候有点莽撞，但那份直白的真心特别打动人。",quote:"绝对要让乐队成功！",guide:"偶尔放慢脚步等等身边的人，不用一直都绷得那么紧。"},
{name:"要乐奈",ip:"《MyGO!!!!!》",code:"EFPCS",title:"永远快乐的治愈小太阳",tags:["天然元气","快乐至上","温和友善"],desc:"你是天生的快乐源泉，性格单纯又开朗，好像永远都没有烦恼。你做事随性自在，怎么开心怎么来，不喜欢给自己太大压力。\n你感性又善良，对每个人都很友善，见不得别人难过，总是想办法给身边的人带来快乐。你活在当下，珍惜每一个开心的瞬间，很容易满足。\n在人际关系里，你是所有人的小太阳，和你在一起会觉得特别轻松治愈。你没有心机，真诚又可爱，大家都忍不住想要照顾你。",quote:"大家一起开心地玩乐队吧！",guide:"一直快乐下去就好，你的笑容就是最珍贵的礼物。"},
{name:"长崎爽世",ip:"《MyGO!!!!!》",code:"ITJCS",title:"默默兜底的乐队主心骨",tags:["沉稳靠谱","内敛负责","温柔体贴"],desc:"你是个沉稳又靠谱的人，话不多却总能把事情都打理好。你做事有条理有规划，考虑问题周全，是团队里的定心丸。\n你理性温和，情绪稳定，遇到事情总能冷静处理。你不喜欢出风头，习惯默默付出，很多功劳都藏在背后，不与人争。\n在人际关系里，你是贴心的照顾者，会默默记住每个人的喜好，照顾大家的情绪。你朋友不多，但每一个都很交心，是最值得信赖的依靠。",quote:"只要大家在一起，就没问题的。",guide:"偶尔也说说自己的难处，不用什么事都自己扛着。"},
{name:"阿尔托莉雅",ip:"《Fate/stay night》",code:"ITJAS",title:"恪守信念的骑士之王",tags:["骑士精神","极致自律","责任感爆棚"],desc:"你是个恪守原则与信念的人，骨子里带着与生俱来的骄傲与责任感。你做事极度严谨自律，对自己要求严苛，永远把责任放在第一位。\n你理性克制，情绪很少外露，遇事冷静沉着，永远以大局为重。你好胜心强，追求完美，不允许自己轻易失败，是天生的领导者与守护者。\n在人际关系里，你不擅长表达温情，显得有些疏离，但内心极其重视伙伴。你会用行动守护自己认可的人，为了信念可以付出一切。",quote:"王保卫国家，国家保卫人民。",guide:"偶尔卸下王的重担，做一次只属于自己的普通人吧。"},
{name:"卫宫士郎",ip:"《Fate/stay night》",code:"IFJAS",title:"追逐正义的理想主义者",tags:["正义的伙伴","温柔固执","利他主义"],desc:"你是个温柔又固执的理想主义者，内心有坚定的正义与信仰，愿意为了帮助别人牺牲自己。你做事认真有毅力，一旦认定目标就绝不回头。\n你感性又善良，见不得别人受苦，总是把别人的事放在自己前面。你有极强的行动力，为了实现理想可以付出超乎常人的努力。\n在人际关系里，你是默默付出的那一个，总是照顾别人的感受，却常常忽略自己。你温柔又坚定，是能给人带来安全感的存在。",quote:"人被杀，就会死。",guide:"先学会爱自己，才能更好地守护别人啊。"},
{name:"远坂凛",ip:"《Fate/stay night》",code:"ETJAN",title:"骄傲聪慧的优等生魔术师",tags:["傲娇天才","计划性强","好胜心强"],desc:"你是个骄傲又聪慧的人，天生自带优等生的气场，做事面面俱到，永远保持优雅得体。你有极强的规划性与好胜心，认定的目标就一定要做到最好。\n你理性又有谋略，心思活络，看问题长远，擅长把控全局。你表面骄傲，内心却很善良，嘴硬心软是你的标志性特点。\n在人际关系里，你是可靠又靠谱的伙伴，虽然嘴上不饶人，但总会在关键时刻出手相助。你自尊心强，不喜欢示弱，却会对认可的人卸下防备。",quote:"我是远坂凛，只是个普通的魔法师。",guide:"偶尔承认自己也会输，一点都不丢人。"},
{name:"吉尔伽美什",ip:"《Fate/stay night》",code:"ETPAN",title:"傲慢不羁的英雄王",tags:["王者傲慢","随心所欲","实力天花板"],desc:"你是天生的王者，骨子里带着刻入骨髓的傲慢与自信，俯视众生，从不屑于迎合任何人。你做事随心所欲，只凭自己的喜好，从不被规则束缚。\n你理性又通透，早已看透世事本质，对人性有着深刻的理解。你思维宏大，眼界极高，普通的人和事根本入不了你的眼。\n在人际关系里，你处于绝对的支配地位，很少有人能让你正眼相看。你极其挑剔，能被你认可的人少之又少，但一旦入了你的眼，就会得到你毫无保留的庇护。",quote:"杂种，谁允许你直视本王了？",guide:"对凡人多一点耐心，毕竟不是所有人都能跟上王的脚步。"},
{name:"菜月昴",ip:"《Re:从零开始的异世界生活》",code:"EFPAS",title:"永不言弃的逆境重生者",tags:["热血笨蛋","永不言弃","重情重义"],desc:"你是个乐观又坚韧的人，哪怕身处绝境也不会轻易放弃，永远朝着光亮的方向走。你性格开朗直爽，爱开玩笑，是团队里的气氛担当。\n你做事随性灵活，擅长随机应变，虽然有时候有点冲动，但总能在绝境中找到出路。你重情重义，为了守护重要的人，可以一次次跌入深渊又重新爬起来。\n在人际关系里，你是真诚又热血的朋友，虽然平时看起来不靠谱，但关键时刻永远不会丢下别人。你用自己的方式温暖着身边的每一个人。",quote:"从零开始吧，从最初的一步开始。",guide:"不用一直强撑着微笑，难过的时候哭出来也没关系。"},
{name:"爱蜜莉雅",ip:"《Re:从零开始的异世界生活》",code:"IFJCS",title:"温柔善良的半精灵公主",tags:["温柔纯粹","善良平等","治愈系"],desc:"你是个温柔又纯粹的人，内心干净又美好，平等地对待每一个人，没有任何偏见。你做事认真负责，有自己的原则与坚持，温和却不软弱。\n你感性又共情，总是设身处地为别人着想，见不得任何人受委屈。你踏实努力，一步一个脚印地往前走，想要证明自己的价值。\n在人际关系里，你是温暖治愈的存在，总是照顾别人的感受，真诚又善良。你虽然有时候有点迟钝，但那份纯粹的心意最打动人。",quote:"我想要成为一个能帮助别人的人。",guide:"你已经做得很好了，不用总是苛责自己。"},
{name:"雷姆",ip:"《Re:从零开始的异世界生活》",code:"IFJAS",title:"专一守护的鬼族少女",tags:["深情专一","温柔坚定","勇敢守护"],desc:"你是个温柔又坚定的人，平时看起来温和体贴，遇事却异常果敢冷静。你做事利落有主见，一旦认定了什么，就会毫不犹豫地去做。\n你感性又专一，对认可的人会付出全部的真心，毫无保留地守护对方。你外表温柔，内心却无比坚强，为了重要的人可以变得无比勇敢。\n在人际关系里，你是贴心的照顾者，总能把别人的生活打理得井井有条。你爱憎分明，对敌人冷酷，对爱人温柔到骨子里。",quote:"因为昴是雷姆的英雄啊。",guide:"除了守护别人，也多留点爱给自己吧。"},
{name:"拉姆",ip:"《Re:从零开始的异世界生活》",code:"ITJCN",title:"毒舌通透的旁观者",tags:["毒舌傲娇","聪慧通透","冷静慵懒"],desc:"你是个冷静又通透的人，习惯站在旁观者的角度看一切，什么事都瞒不过你的眼睛。你说话毒舌，一针见血，却总能说到点子上。\n你理性又聪慧，心思缜密，看问题透彻，很多事情心里都明白，只是懒得说。你性格慵懒，不喜欢多管闲事，只在意自己重视的人。\n在人际关系里，你看起来疏离冷淡，其实内心很看重感情。你不会说甜言蜜语，却会用自己的方式默默守护在意的人。",quote:"拉姆是全能的，除了角以外。",guide:"偶尔说句软话，会收到意想不到的惊喜哦。"},
{name:"鲁迪乌斯",ip:"《无职转生》",code:"ITPAN",title:"重生逆袭的天才魔法师",tags:["内敛聪慧","务实努力","深谋远虑"],desc:"你是个内敛又聪慧的人，心里藏着很多想法与经历，不轻易向人展露。你做事灵活随性，懂得变通，不会死钻牛角尖，擅长根据情况调整策略。\n你理性又务实，清楚自己想要什么，会为了目标付出踏踏实实的努力。你思维活跃，想法很多，看得长远，总能提前做好准备。\n在人际关系里，你慢热又谨慎，不会轻易交心，但对认可的人极其重视。你重情重义，会用自己的能力守护身边的人。",quote:"这次的人生，我一定要认真地活下去。",guide:"不用总是背着过去的包袱，现在的你已经足够好了。"},
{name:"洛琪希",ip:"《无职转生》",code:"ITJCS",title:"认真温柔的魔法老师",tags:["严谨认真","温柔可靠","踏实努力"],desc:"你是个认真又温柔的人，做事严谨有条理，一步一个脚印，踏实又靠谱。你对自己要求严格，对待专业一丝不苟，是让人信赖的前辈与老师。\n你理性温和，情绪稳定，遇到事情总能冷静处理。你不擅长社交，有点害羞慢热，但内心极其善良真诚，会真心实意地帮助别人。\n在人际关系里，你是可靠又贴心的长辈与朋友，会耐心地指导别人，温柔地包容别人的缺点。你虽然话不多，但总能给人很安心的感觉。",quote:"魔法是努力就能学会的东西。",guide:"不用总是那么拘谨，偶尔放松一下也没关系。"},
{name:"艾莉丝",ip:"《无职转生》",code:"EFPAS",title:"傲娇直率的狂龙大小姐",tags:["傲娇冲动","热血直球","敢爱敢恨"],desc:"你是个直来直去的人，性格骄傲又冲动，心里想什么就说什么，从不拐弯抹角。你做事随性大胆，想到什么就做什么，从来不害怕挑战。\n你感性又直率，爱憎分明，喜欢就是喜欢，讨厌就是讨厌。你好胜心强，不服输，越是困难越要往前冲，浑身有一股野性的生命力。\n在人际关系里，你是傲娇又可爱的存在，嘴上不饶人，心里却比谁都在意。你对认可的人极其真心，会用全部的力量去守护对方。",quote:"我可是艾莉丝·伯雷亚斯·格雷拉特！",guide:"发脾气之前先深呼吸三秒，会少很多后悔的事。"},
{name:"希露菲",ip:"《无职转生》",code:"IFJCS",title:"温柔守护的治愈系精灵",tags:["温柔内敛","善解人意","默默守护"],desc:"你是个温柔又内敛的人，性格安静不张扬，总是默默付出，不喜欢争风头。你做事细心认真，考虑问题周全，总能把事情打理得妥妥帖帖。\n你感性又善解人意，能敏锐察觉到别人的情绪，总是设身处地为别人着想。你温柔却有力量，认定的事就会坚持到底。\n在人际关系里，你是贴心的治愈者，总是默默照顾别人的感受，让人觉得温暖又安心。你对感情专一又长久，会一直陪在重要的人身边。",quote:"只要能待在你身边，就够了。",guide:"偶尔也主动表达自己的心意，别让温柔藏在心里。"},
{name:"碇真嗣",ip:"《EVA》",code:"IFPCN",title:"敏感孤独的少年使徒",tags:["敏感内向","逃避型人格","情绪内耗"],desc:"你是个内心敏感又脆弱的人，很容易在意别人的看法，常常陷入自我怀疑与内耗。你性格偏内向，不擅长与人交往，遇到压力第一反应是想逃避。\n你做事随性，没什么规划，习惯随波逐流。你感性又细腻，内心世界极其丰富，常常陷入抽象的情绪与思考里，对世界有自己独特的感受。\n在人际关系里，你害怕被伤害，也害怕伤害别人，所以总是保持距离。但你内心极其渴望被爱与认可，只要一点点温柔，就能让你付出全部。",quote:"不能逃，不能逃，不能逃。",guide:"不用逼自己和所有人都搞好关系，独处也可以很快乐。"},
{name:"绫波丽",ip:"《EVA》",code:"ITPCS",title:"淡然疏离的零号少女",tags:["清冷疏离","理性淡然","纯粹简单"],desc:"你是个清冷又疏离的人，话很少，情绪波动也很小，好像对什么都无所谓。你做事随性简单，不喜欢复杂的东西，怎么省事怎么来。\n你理性又淡然，对很多事情都看得很开，不会被情绪左右。你话不多，却总能一针见血，有自己的想法与坚持。\n在人际关系里，你显得有些被动与疏离，不擅长表达感情。但你内心其实很纯粹，一旦对人敞开心扉，就会无比信任对方。",quote:"我是谁？",guide:"试着多感受一下生活里的小美好，你也可以拥有烟火气。"},
{name:"明日香",ip:"《EVA》",code:"EFJAS",title:"骄傲倔强的二号机驾驶员",tags:["傲娇好强","骄傲耀眼","渴望认可"],desc:"你是个骄傲又耀眼的人，浑身充满生命力与好胜心，永远想做到最好，证明自己的价值。你做事认真有目标，计划性强，绝不允许自己输给别人。\n你外向又热情，走到哪里都是焦点，表面自信满满，内心却极度渴望被认可。你自尊心极强，从不轻易示弱，哪怕难过也会藏起来。\n在人际关系里，你看起来强势又骄傲，其实内心很敏感脆弱。你嘴硬心软，嘴上不饶人，心里却很在意身边的人。",quote:"我可是天才少女明日香！",guide:"不用一直证明自己，你本身就已经足够优秀了。"},
{name:"渚薰",ip:"《EVA》",code:"ITPCN",title:"温柔自由的风之使徒",tags:["温柔通透","随性自由","深邃包容"],desc:"你是个温柔又通透的人，身上带着一种自由又疏离的气质，好像随时都会消失。你做事随性自在，不喜欢被束缚，跟着自己的心意走。\n你理性又深刻，对世界和人性有着超乎常人的理解，很多事情都看得很透。你包容又温和，不会轻易评判别人，总能给人带来安慰。\n在人际关系里，你是特别的存在，能轻易走进别人的内心，却又保持着距离。你对认可的人极其温柔，带着宿命般的治愈感。",quote:"也许，我就是为了与你相遇才诞生的。",guide:"偶尔也为某个人停留一下，自由与爱并不冲突。"},
{name:"艾伦·耶格尔",ip:"《进击的巨人》",code:"IFPAN",title:"追逐自由的偏执追光者",tags:["偏执自由","信念至上","执拗极端"],desc:"你是个内心极其执拗的人，一旦认定了目标，就会不顾一切地往前走，谁都拦不住。你性格偏内向，不擅长表达感情，却有着超乎常人的执念。\n你做事随性，不受任何规则束缚，为了达成目标可以打破一切常规。你感性又极端，容易陷入自己的情绪与信念里，对自由有着极致的渴望。\n在人际关系里，你不擅长表达，却极其重视伙伴。你会用自己的方式守护重要的人，哪怕双手沾满鲜血，哪怕与全世界为敌。",quote:"海的那边，是自由吗？",guide:"偶尔停下来看看身边的人，别为了远方忽略了眼前。"},
{name:"利威尔",ip:"《进击的巨人》",code:"ITJAS",title:"洁癖严苛的人类最强",tags:["人类最强","极致严谨","洁癖毒舌"],desc:"你是个沉默寡言的实力派，话很少，却用实力说话，是所有人心中最可靠的存在。你做事极致严谨，对自己对别人要求都很高，追求完美。\n你理性又冷静，遇到事情永远沉着镇定，从不冲动行事。你好胜心强，战斗力顶尖，却从不欺凌弱小，有自己的原则与底线。\n在人际关系里，你不擅长表达温情，说话还有点毒舌，却会用行动守护伙伴。你朋友不多，但每一个都是可以交付后背的生死之交。",quote:"做出选择吧，然后坚信它。",guide:"偶尔也放松一下对自己的要求，灰尘没那么可怕。"},
{name:"三笠·阿克曼",ip:"《进击的巨人》",code:"IFJCS",title:"专一守护的阿克曼战士",tags:["专一守护","温柔坚定","战斗力爆表"],desc:"你是个温柔又坚定的人，话不多，却会用行动证明一切。你做事从容有规划，冷静又果决，遇到事情永远临危不乱。\n你感性又专一，对重要的人有着刻入骨髓的守护欲，为了对方可以付出一切。你外表看起来冷酷，内心却极其温柔，只对认可的人展露柔软。\n在人际关系里，你是沉默的守护者，不会说甜言蜜语，却永远会在最危险的时候站出来。你对感情极其忠贞，一旦认定就是一辈子。",quote:"艾伦，只要有你在，我就无所不能。",guide:"除了守护别人，也多为自己活一活吧。"},
{name:"埃尔文·史密斯",ip:"《进击的巨人》",code:"ETJAN",title:"为真相献祭的谋略家",tags:["深谋远虑","领导力MAX","为真相献身"],desc:"你是天生的领导者与谋略家，有着超凡的大局观与远见，做事步步为营，每一步都在计划之中。你外向有魄力，能凝聚人心，带领团队向着目标前进。\n你理性到近乎冷酷，为了真相与胜利，可以牺牲一切，包括自己和部下的生命。你野心勃勃，目标明确，为了达成目的可以忍受一切质疑与误解。\n在人际关系里，你是让人敬畏的领袖，威严又有魅力。你不会轻易表露内心，很少有人能看透你的真实想法，但所有人都愿意追随你。",quote:"献出你们的心脏吧！",guide:"偶尔也让自己休息一下，不用一直都紧绷着弦。"},
{name:"蒙奇·D·路飞",ip:"《海贼王》",code:"EFPAS",title:"向往自由的海上梦想家",tags:["自由至上","热血纯粹","重情重义"],desc:"你是个天生的梦想家，向往自由，讨厌被束缚，认定的梦想就一定会去实现。你性格开朗热血，永远乐观积极，哪怕身处绝境也能笑得出来。\n你做事随性洒脱，跟着感觉走，不喜欢复杂的算计与阴谋。你重情重义，把伙伴看得比什么都重要，为了朋友可以拼上性命。\n在人际关系里，你是天生的领袖，真诚又纯粹，能吸引各种各样的人来到你身边。你简单又快乐，和你在一起永远不会觉得无聊。",quote:"我是要成为海贼王的男人！",guide:"一直朝着梦想冲就对了，你的身后永远有伙伴。"},
{name:"漩涡鸣人",ip:"《火影忍者》",code:"EFJAS",title:"永不言弃的木叶忍者",tags:["永不言弃","阳光坚韧","说到做到"],desc:"你是个阳光又坚韧的人，哪怕从小不被认可，也从未放弃过自己的梦想。你做事有目标有韧劲，说到做到，一旦许下承诺就一定会兑现。\n你外向热情，感染力强，总能用自己的乐观打动别人。你重视羁绊，把伙伴看得比什么都重要，愿意为了重要的人付出一切。\n在人际关系里，你是温暖的小太阳，能用真心融化所有冰冷。你不服输，不放弃，最终活成了所有人都认可的样子。",quote:"说到做到，这就是我的忍道！",guide:"你已经实现了梦想，偶尔也停下来享受一下吧。"},
{name:"黑崎一护",ip:"《死神》",code:"IFPAS",title:"温柔守护的死神代理",tags:["温柔内敛","责任担当","随性不纠结"],desc:"你是个内敛又温柔的人，不擅长表达感情，却有着极强的责任感与担当。你做事随性不纠结，遇到事情直接面对，不喜欢拖泥带水。\n你感性又重情义，为了守护重要的人，可以变得无比强大。你平时看起来懒洋洋的，没什么干劲，但关键时刻永远靠得住。\n在人际关系里，你是默默守护的那一个，不会说漂亮话，却永远会在别人需要的时候出现。你温柔又有力量，是最值得信赖的伙伴。",quote:"我要保护大家，所以才要变得更强。",guide:"不用总是一个人扛，身边的人也想和你一起战斗。"},
{name:"宇智波佐助",ip:"《火影忍者》",code:"ITJAN",title:"追逐力量的孤独复仇者",tags:["冷峻偏执","隐忍谋略","力量至上"],desc:"你是个冷峻又偏执的人，内心有极强的执念，为了目标可以斩断一切。你做事有谋划有目标，隐忍又坚定，不达目的决不罢休。\n你理性又冷静，情绪很少外露，心思深沉，很少有人能看透你的想法。你追求力量与真相，愿意为此付出一切代价，哪怕背负所有骂名。\n在人际关系里，你显得孤独又疏离，不擅长表达感情。但你内心极其看重羁绊，只是用自己的方式去守护与铭记。",quote:"我可是拼了命去做的，不要用天才两个字抹杀我的努力！",guide:"偶尔也回头看看，有人一直在等你。"},
{name:"后藤一里（波奇）",ip:"《孤独摇滚》",code:"IFPCN",title:"社恐脑补的吉他天才",tags:["重度社恐","脑洞大师","敏感细腻"],desc:"你是个极度社恐的人，不擅长和人打交道，一紧张就会胡思乱想，脑补出一万种糟糕的情况。你性格内向敏感，内心世界却极其丰富，脑洞大到离谱。\n你做事随性散漫，日常摆烂，没什么计划性。你感性又细腻，对喜欢的事情有着极致的天赋与热爱，沉浸其中的时候会闪闪发光。\n在人际关系里，你害怕被讨厌，总是小心翼翼，但内心极其渴望朋友。你虽然社恐，却会用自己的方式珍惜每一段友谊，真诚又可爱。",quote:"对不起，对不起，对不起！",guide:"其实你比自己想象中要可爱得多，大胆一点也没关系。"},
{name:"山田凉",ip:"《孤独摇滚》",code:"ITPAN",title:"特立独行的贝斯怪人",tags:["特立独行","毒舌理性","随性不羁"],desc:"你是个特立独行的人，不喜欢随波逐流，有自己独特的审美与坚持。你话不多，还有点毒舌，总是一针见血，却句句在理。\n你理性又有想法，思维跳脱，对很多事情都有自己独特的见解。你做事随性不羁，讨厌被规则束缚，只做自己喜欢的事。\n在人际关系里，你显得有些孤僻，朋友不多，但都是同频的人。你不擅长表达温柔，却会用自己的方式支持在意的人。",quote:"怪人有什么不好，总比无聊的普通人强。",guide:"一直做自己就好，总有人会懂你的奇奇怪怪。"},
{name:"喜多郁代",ip:"《孤独摇滚》",code:"EFJCS",title:"阳光治愈的人气少女",tags:["阳光开朗","温柔体贴","人气王"],desc:"你是个阳光又开朗的人，走到哪里都受欢迎，天生自带亲和力。你做事认真周全，会照顾到每个人的情绪，情商很高。\n你外向又温柔，待人真诚友善，见不得别人难过，总是想办法给身边的人带来温暖。你虽然看起来是天生的社交达人，其实也会有不自信的时候，只是习惯用微笑掩饰。\n在人际关系里，你是大家的小太阳，和你在一起永远觉得舒服又开心。你温柔又坚定，是朋友里最靠谱的存在。",quote:"大家一起加油吧！",guide:"不用一直维持完美的形象，偶尔不完美也很可爱。"},
{name:"伊地知虹夏",ip:"《孤独摇滚》",code:"ETJCS",title:"靠谱兜底的乐队队长",tags:["队长担当","沉稳靠谱","责任心强"],desc:"你是个沉稳又靠谱的人，是团队里的主心骨与定心丸。你做事有条理有责任心，考虑问题周全，总能把各种事情都打理好。\n你外向又开朗，擅长和人打交道，能协调好团队里的各种关系。你温和又有担当，遇到问题永远第一个站出来，默默兜底，从不抱怨。\n在人际关系里，你是大家的依靠，总是照顾别人的感受，却常常忽略自己。你温柔又有力量，是最值得信赖的队长与朋友。",quote:"有我在，没问题的。",guide:"偶尔也撒个娇，让别人照顾照顾你吧。"}
];
let currentIdx=0;
let answers=new Array(18).fill(null);
let userScores=[0,0,0,0,0];
let radarChart=null;
const loadingTexts=["正在扫描你的灵魂代码...","正在匹配二次元世界...","即将揭晓你的身份..."];
let loadingTimer=null;

function switchPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function startQuiz(){currentIdx=0;answers=new Array(18).fill(null);renderQuestion();switchPage('page-quiz');}
function renderQuestion(){
  const q=QUESTIONS[currentIdx];
  document.getElementById('currentNum').textContent=currentIdx+1;
  document.getElementById('progressFill').style.width=((currentIdx+1)/18*100)+'%';
  document.getElementById('questionText').textContent=q.q;
  const list=document.getElementById('optionsList');
  list.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn'+(answers[currentIdx]===i?' selected':'');
    btn.textContent=String.fromCharCode(65+i)+'. '+opt.t;
    btn.onclick=()=>selectOption(i);
    list.appendChild(btn);
  });
  document.getElementById('btnBack').disabled=currentIdx===0;
}
function selectOption(i){
  answers[currentIdx]=i;
  const q=QUESTIONS[currentIdx];
  const scores=q.opts[i].s;
  if(currentIdx<17){
    currentIdx++;
    setTimeout(renderQuestion,200);
  }else{
    setTimeout(calculateResult,300);
  }
}
function prevQuestion(){if(currentIdx>0){currentIdx--;renderQuestion();}}
function calculateResult(){
  userScores=[0,0,0,0,0];
  answers.forEach((optIdx,qIdx)=>{
    if(optIdx!==null){
      const scores=QUESTIONS[qIdx].opts[optIdx].s;
      for(let i=0;i<5;i++)userScores[i]+=scores[i];
    }
  });
  switchPage('page-loading');
  let ltIdx=0;
  document.getElementById('loadingText').textContent=loadingTexts[0];
  loadingTimer=setInterval(()=>{
    ltIdx=(ltIdx+1)%loadingTexts.length;
    document.getElementById('loadingText').textContent=loadingTexts[ltIdx];
  },700);
  setTimeout(()=>{
    clearInterval(loadingTimer);
    showResult();
  },2000);
}
function matchCharacter(){
  let minDist=Infinity,best=null;
  CHARACTERS.forEach(c=>{
    const target=codeToScores(c.code);
    let dist=0;
    for(let i=0;i<5;i++){
      const norm=userScores[i]/6;
      dist+=Math.pow(norm-target[i],2);
    }
    dist=Math.sqrt(dist);
    if(dist<minDist){minDist=dist;best=c;}
  });
  const maxDist=Math.sqrt(80);
  let compat=Math.round((1-minDist/maxDist)*100);
  compat=Math.max(75,Math.min(98,compat));
  return{char:best,compat};
}
function showResult(){
  const{char,compat}=matchCharacter();
  document.getElementById('resultName').textContent=char.name;
  document.getElementById('resultIp').textContent=char.ip;
  document.getElementById('resultCompat').textContent=compat;
  document.getElementById('resultTitle').textContent=char.title;
  document.getElementById('resultQuote').textContent='"'+char.quote+'"';
  document.getElementById('resultGuide').textContent=char.guide;
  document.getElementById('posterName').textContent=char.name;
  document.getElementById('posterIp').textContent=char.ip;
  document.getElementById('posterCompat').textContent=compat+'%';
  document.getElementById('posterTitle').textContent=char.title;
  const tagsBox=document.getElementById('resultTags');
  tagsBox.innerHTML=char.tags.map(t=>`<span class="result-tag">#${t}</span>`).join('');
  const pTagsBox=document.getElementById('posterTags');
  pTagsBox.innerHTML=char.tags.map(t=>`<div class="poster-tag">#${t}</div>`).join('');
  const descBox=document.getElementById('resultDesc');
  descBox.innerHTML=char.desc.split('\n').map(d=>`<p class="desc-paragraph">${d}</p>`).join('');
  switchPage('page-result');
  setTimeout(drawRadar,100);
}
function drawRadar(){
  const dom=document.getElementById('radarChart');
  if(radarChart)radarChart.dispose();
  radarChart=echarts.init(dom);
  const max=12;
  const data=userScores.map(v=>Math.round(v/max*100));
  const option={
    backgroundColor:'transparent',
    radar:{
      indicator:[
        {name:'外向 E',max:100},
        {name:'理性 T',max:100},
        {name:'计划 J',max:100},
        {name:'进取 A',max:100},
        {name:'具象 S',max:100}
      ],
      center:['50%','50%'],
      radius:'65%',
      axisName:{color:'rgba(255,255,255,0.7)',fontSize:13},
      splitArea:{areaStyle:{color:['rgba(139,92,246,0.05)','rgba(59,130,246,0.05)']}},
      splitLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}},
      axisLine:{lineStyle:{color:'rgba(255,255,255,0.15)'}}
    },
    series:[{
      type:'radar',
      data:[{
        value:data,
        name:'你的人格',
        symbol:'circle',
        symbolSize:8,
        lineStyle:{color:'#a78bfa',width:2},
        areaStyle:{color:'rgba(139,92,246,0.3)'},
        itemStyle:{color:'#a78bfa'}
      }]
    }]
  };
  radarChart.setOption(option);
  window.addEventListener('resize',()=>radarChart&&radarChart.resize());
}
function restart(){switchPage('page-welcome');}
function generatePoster(){
  const tpl=document.getElementById('posterTemplate');
  html2canvas(tpl,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{
    const img=canvas.toDataURL('image/png');
    document.getElementById('posterImg').src=img;
    document.getElementById('posterModal').classList.add('active');
  }).catch(err=>{alert('海报生成失败，请重试');});
}
function closePoster(){document.getElementById('posterModal').classList.remove('active');}
</script>
</body>
</html>
